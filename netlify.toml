[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Swiss Ephemeris data files for the natal chart: fixed for a given name
[[headers]]
  for = "/ephe/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# the natal chart's place index: rebuilt now and then under the same names
[[headers]]
  for = "/places/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
